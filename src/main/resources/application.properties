spring.application.name=Vestaboard
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

app.security.allowed-domain=cinqict.nl
app.security.allowed-origins=http://localhost:4200,https://vestaboard.cinqict.nl
app.security.admin-emails=${VESTABOARD_ADMIN_EMAILS:}

app.gateway.vestaboard.base-url=https://cloud.vestaboard.com/
app.gateway.vestaboard.token=${secret-verstaboard-token}
app.gateway.vestaboard.vbml.base-url=https://vbml.vestaboard.com/compose

