spring.application.name=Vestaboard

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

app.gateway.vestaboard.base-url=https://cloud.vestaboard.com/
app.gateway.vestaboard.token=${secret-verstaboard-token}
app.gateway.vestaboard.vbml.base-url=https://vbml.vestaboard.com/compose